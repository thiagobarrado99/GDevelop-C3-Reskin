# Apache vhost for Assemble3 (Laravel landing + API at /, the editor build at
# /editor/). Copy to /etc/apache2/sites-available/, then:
#   sudo a2enmod rewrite headers expires deflate
#   sudo a2ensite assemble.theiagod.com && sudo systemctl reload apache2
#   sudo certbot --apache -d assemble.theiagod.com   (adds the :443 vhost)
<VirtualHost *:80>
    ServerName assemble.theiagod.com
    ServerAdmin webmaster@theiagod.com

    DocumentRoot /var/www/assemble/public

    <Directory /var/www/assemble/public>
        Options -Indexes +FollowSymLinks
        # Laravel's public/.htaccess (front controller) and the editor's
        # public/editor/.htaccess (cache headers).
        AllowOverride All
        Require all granted
    </Directory>

    # /editor -> /editor/ (mod_dir), then public/editor/index.html.
    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/assemble-error.log
    CustomLog ${APACHE_LOG_DIR}/assemble-access.log combined
</VirtualHost>
